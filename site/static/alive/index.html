<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Denoise — alive</title>
<style>
  :root{ --bg:#efe8db; --paper:#f6f1e7; --ink:#1a1712; --mut:#5d574d; --teal:#1c8273; --teal-bright:#136b5e; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  /* embed: transparent so the host page's bg (light/dark) shows through the iframe */
  body{ background:transparent; color:var(--ink); font:16px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif; overflow:hidden; }
  #c{ display:block; width:100%; height:100%; position:fixed; inset:0; touch-action:pan-y; }

  /* embed: control panel hidden unless ?tune — the piece auto-runs with tuned defaults */
  #panel{ display:none; position:absolute; top:12px; right:12px; width:228px; background:var(--paper);
    border:1px solid rgba(26,23,18,.12); border-radius:10px; padding:12px 14px;
    box-shadow:0 6px 30px rgba(26,23,18,.10);
    font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:12px; user-select:none; }
  #panel h1{ font:600 11px/1.2 "IBM Plex Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); margin:0 0 6px; }
  .row{ margin:8px 0; }
  .row label{ display:flex; justify-content:space-between; color:var(--mut); margin-bottom:4px; }
  .row label b{ color:var(--ink); font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--teal); }
  #collapse{ position:absolute; top:10px; right:12px; cursor:pointer; color:var(--mut); background:none; border:0; font-size:14px; }
  #panel.min .body{ display:none; }
  .toggle{ display:flex; align-items:center; gap:8px; color:var(--mut); cursor:pointer; margin:10px 0 2px; }
  .toggle input{ accent-color:var(--teal); }
  body.tune #panel{ display:block; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
      <div id="panel" class="min">
        <button id="collapse" title="collapse">+</button>
        <h1>alive</h1>
        <div class="body">
          <div class="row"><label>breath amt <b id="vbAmt">0.020</b></label>
            <input id="bAmt" type="range" min="0" max="0.04" step="0.002" value="0.02" /></div>
          <div class="row"><label>breath period <b id="vbPer">9</b>s</label>
            <input id="bPer" type="range" min="4" max="22" step="1" value="9" /></div>
          <div class="row"><label>ambient <b id="vamb">0.50</b></label>
            <input id="amb" type="range" min="0.1" max="0.9" step="0.01" value="0.50" /></div>
          <div class="row"><label>cluster size <b id="vambR">0.60</b></label>
            <input id="ambR" type="range" min="0.2" max="1.0" step="0.02" value="0.60" /></div>
          <div class="row"><label>ambient speed <b id="vambS">0.40</b></label>
            <input id="ambS" type="range" min="0.06" max="0.66" step="0.01" value="0.40" /></div>
          <div class="row"><label>hover strength <b id="vhStr">0.08</b></label>
            <input id="hStr" type="range" min="0.02" max="0.14" step="0.01" value="0.08" /></div>
          <div class="row"><label>hover radius <b id="vhRad">60</b>px</label>
            <input id="hRad" type="range" min="20" max="100" step="5" value="60" /></div>
          <div class="row"><label>hover response <b id="vhSpd">0.20</b>s</label>
            <input id="hSpd" type="range" min="0.05" max="1.5" step="0.05" value="0.2" /></div>
          <div class="row"><label>max blob size <b id="vmax">20</b>px</label>
            <input id="maxPx" type="range" min="8" max="32" step="1" value="20" /></div>
          <div class="row"><label>circle radius <b id="vrs">0.85</b></label>
            <input id="rs" type="range" min="0.4" max="1.3" step="0.05" value="0.85" /></div>
          <label class="toggle"><input id="split" type="checkbox" checked /> hover splits apart (vs merges)</label>
        </div>
      </div>

<script>
const DATA_URL = "data/2_hydrolase.alive.json";   // coarse (roots=2, balanced) -> big blobs

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let D=null, view=null, leaves=[], parent=null, charge=null;
let qLeaf=null, repLeaf=null, forced=null, css=null;
let sX,sY,sR,sCol,sFinal;                            // per-frame render state of each node

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (/[?&]tune\b/.test(location.search)) document.body.classList.add("tune");

const ui={};
["bAmt","vbAmt","bPer","vbPer","amb","vamb","ambR","vambR","ambS","vambS",
 "hStr","vhStr","hRad","vhRad","hSpd","vhSpd","maxPx","vmax","rs","vrs","split"].forEach(id=>ui[id]=document.getElementById(id));
const P={};
function readParams(){
  for (const k of ["bAmt","bPer","amb","ambR","ambS","hStr","hRad","hSpd","maxPx","rs"]) P[k]=parseFloat(ui[k].value);
  P.split=ui.split.checked;
}

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(t){ return t<0?0:t>1?1:t; }
function ease(t){ return t*t*(3-2*t); }

function cw(){ return cv.clientWidth; }
function ch(){ return cv.clientHeight; }

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=cw()*dpr; cv.height=ch()*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  computeView();
  if(reduced && D) draw(0);
}
function computeView(){
  if(!D) return;
  const {w,h}=D.bounds, pad=0.08, W=cw(), H=ch();
  const s=Math.min(W*(1-2*pad)/w, H*(1-2*pad)/h);
  view={ s, ox:(W - s*w)/2, oy:(H - s*h)/2 };
  computeFloors();
}
const X=x=>view.ox + x*view.s;
const Y=y=>view.oy + y*view.s;

function precompute(){
  const N=D.nodes, n=N.length;
  parent=new Int32Array(n).fill(-1);
  repLeaf=new Int32Array(n).fill(-1);
  forced=new Uint8Array(n);
  sX=new Float32Array(n); sY=new Float32Array(n); sR=new Float32Array(n);
  sCol=new Float32Array(n*3); sFinal=new Uint8Array(n);
  css=new Array(n);
  leaves=[];
  for(let i=0;i<n;i++){
    const nd=N[i];
    css[i]=`rgb(${nd.c[0]|0},${nd.c[1]|0},${nd.c[2]|0})`;
    if(nd.ch){ for(const ci of nd.ch) parent[ci]=i; }
    else { repLeaf[i]=leaves.length; leaves.push(i); }
  }
  // Each internal node takes its merge level from the descendant leaf nearest its centre
  // (children precede parents in the node list, so one ascending pass suffices).
  for(let i=0;i<n;i++){
    const nd=N[i]; if(!nd.ch) continue;
    let best=-1, bd=Infinity;
    for(const ci of nd.ch){
      const L=N[leaves[repLeaf[ci]]], dx=L.x-nd.x, dy=L.y-nd.y, d=dx*dx+dy*dy;
      if(d<bd){ bd=d; best=repLeaf[ci]; }
    }
    repLeaf[i]=best;
  }
  roots=D.roots.slice();
  charge=new Float32Array(leaves.length);
  qLeaf=new Float32Array(leaves.length);
}
let roots=[];

// Nodes larger than the max blob size never render merged: they are always split.
function computeFloors(){
  if(!D || !view) return;
  const N=D.nodes, maxNodeR=P.maxPx/(view.s*P.rs);
  for(let i=0;i<N.length;i++) forced[i] = N[i].ch && N[i].r>maxNodeR ? 1 : 0;
}

// --- pointer (eased position; presence), relative to the canvas box ---
let mxS=0, myS=0, mTargetX=0, mTargetY=0, mInside=false;
function setM(e){
  const r=cv.getBoundingClientRect();
  mTargetX=e.clientX-r.left; mTargetY=e.clientY-r.top;
  if(!mInside){ mxS=mTargetX; myS=mTargetY; }       // snap on entry: no sweep in from off-canvas
  mInside=true;
}
const leave=()=>{ mInside=false; };
cv.addEventListener("pointermove",setM);
cv.addEventListener("pointerdown",setM);
cv.addEventListener("pointerleave",leave);
cv.addEventListener("pointercancel",leave);
cv.addEventListener("pointerup",e=>{ if(e.pointerType!=="mouse") leave(); });

const ids=[], stack=[];
const byRadius=(a,b)=>(sR[b]-sR[a]) || (a-b);           // stable order: no shimmer between equal sizes

// Top-down: a node splits into its children as its own merge level rises past its split
// time. Children are interpolated from the parent's *rendered* state using the parent's
// level, so a group collapses into exactly the dot that replaces it — nothing pops.
function layout(){
  const N=D.nodes;
  ids.length=0; stack.length=0;
  for(const r of roots){
    const nd=N[r];
    sX[r]=nd.x; sY[r]=nd.y; sR[r]=nd.r;
    sCol[3*r]=nd.c[0]; sCol[3*r+1]=nd.c[1]; sCol[3*r+2]=nd.c[2]; sFinal[r]=1;
    stack.push(r);
  }
  while(stack.length){
    const id=stack.pop(), nd=N[id];
    const e = !nd.ch ? 0 : forced[id] ? 1 : clamp01((qLeaf[repLeaf[id]]-nd.s)/(nd.d||0.05));
    if(e<=0){ ids.push(id); continue; }
    const t=ease(e), fin=sFinal[id] && t>=1;
    for(const c of nd.ch){
      const cn=N[c];
      sX[c]=lerp(sX[id],cn.x,t); sY[c]=lerp(sY[id],cn.y,t); sR[c]=lerp(sR[id],cn.r,t);
      sCol[3*c]  =lerp(sCol[3*id],  cn.c[0],t);
      sCol[3*c+1]=lerp(sCol[3*id+1],cn.c[1],t);
      sCol[3*c+2]=lerp(sCol[3*id+2],cn.c[2],t);
      sFinal[c]=fin?1:0;
      stack.push(c);
    }
  }
}

function draw(T,dt){
  const W=cw(), H=ch();
  ctx.clearRect(0,0,W,H);
  if(!D) return;
  dt=dt||0;

  const kM = 1-Math.exp(-dt/0.06);
  mxS=lerp(mxS,mTargetX,kM); myS=lerp(myS,mTargetY,kM);

  const breath = P.bAmt*(0.5-0.5*Math.cos(6.2832*T/P.bPer));
  const qG = 1 - breath;

  const aS=P.ambS, cx=W/2, cy=H/2, Rx=W*0.30, Ry=H*0.30;
  const ambSig=Math.min(W,H)*P.ambR, ambDen=2*ambSig*ambSig;
  const pulse=(ph)=>{ const u=0.5+0.5*Math.sin(T*0.9*aS+ph); return u*u; };
  const d0x=cx+Rx*Math.sin(T*1.0*aS+0.0), d0y=cy+Ry*Math.sin(T*1.3*aS+1.3), d0s=P.amb*pulse(0.0);
  const d1x=cx+Rx*Math.sin(T*0.7*aS+2.6), d1y=cy+Ry*Math.sin(T*0.9*aS+4.0), d1s=P.amb*pulse(3.1);

  const hStrT = mInside ? P.hStr : 0;
  const hDen=2*P.hRad*P.hRad;
  const kIn  = 1-Math.exp(-dt/P.hSpd);                 // exponential approach: soft start and stop
  const kOut = 1-Math.exp(-dt/(P.hSpd*2.5));           // release more slowly than attack
  const hStrV = P.hStr || 1;

  const N=D.nodes, s=view.s, ox=view.ox, oy=view.oy;
  for(let k=0;k<leaves.length;k++){
    const li=leaves[k], nd=N[li], sx=ox+nd.x*s, sy=oy+nd.y*s;
    let dx=sx-d0x, dy=sy-d0y;
    let ambF=d0s*Math.exp(-(dx*dx+dy*dy)/ambDen);
    dx=sx-d1x; dy=sy-d1y;
    ambF+=d1s*Math.exp(-(dx*dx+dy*dy)/ambDen);
    let ht=0;
    if(hStrT>0){ dx=sx-mxS; dy=sy-myS; ht=hStrT*Math.exp(-(dx*dx+dy*dy)/hDen); }
    let c=charge[k];
    c += (ht-c)*(ht>c?kIn:kOut);
    charge[k]=c;

    let q;
    if(P.split){
      // hover suppresses the ambient merge, eased so there is no hard edge
      const sup=clamp01(c/hStrV);
      q=qG-ambF*(1-0.85*ease(sup));
    } else {
      q=qG-ambF-c;                                     // charge lowers q -> merge into blobs
    }
    qLeaf[k] = q<0 ? 0 : q>1 ? 1 : q;
  }
  layout();
  ids.sort(byRadius);
  const rs=P.rs*s;
  for(let i=0;i<ids.length;i++){
    const id=ids[i];
    let pr=sR[id]*rs; if(pr<0.35) pr=0.35;
    ctx.beginPath(); ctx.arc(ox+sX[id]*s, oy+sY[id]*s, pr, 0, 6.2832);
    ctx.fillStyle = sFinal[id] ? css[id]
      : `rgb(${sCol[3*id]|0},${sCol[3*id+1]|0},${sCol[3*id+2]|0})`;
    ctx.fill();
  }
}

// Animation clock accumulates only while visible, so pausing off-screen doesn't make the
// ambient drifters jump when it resumes.
let T=0, last=0, visible=true, rafId=0;
function tick(now){
  const dt = last ? Math.min((now-last)/1000, 0.05) : 0;
  last=now; T+=dt;
  draw(T,dt);
  rafId=requestAnimationFrame(tick);
}
function start(){ if(!rafId && !reduced && D){ last=0; rafId=requestAnimationFrame(tick); } }
function stop(){ if(rafId){ cancelAnimationFrame(rafId); rafId=0; } }
if(window.IntersectionObserver){
  new IntersectionObserver(es=>{ visible=es[0].isIntersecting; visible?start():stop(); }).observe(cv);
}

const bind=(el,out,f)=>{ const g=()=>{ out.textContent=f(el.value); readParams(); computeFloors(); }; el.oninput=g; g(); };
bind(ui.bAmt,ui.vbAmt,v=>(+v).toFixed(3));
bind(ui.bPer,ui.vbPer,v=>(+v).toFixed(0));
bind(ui.amb,ui.vamb,v=>(+v).toFixed(2));
bind(ui.ambR,ui.vambR,v=>(+v).toFixed(2));
bind(ui.ambS,ui.vambS,v=>(+v).toFixed(2));
bind(ui.hStr,ui.vhStr,v=>(+v).toFixed(2));
bind(ui.hRad,ui.vhRad,v=>(+v).toFixed(0));
bind(ui.hSpd,ui.vhSpd,v=>(+v).toFixed(2));
bind(ui.maxPx,ui.vmax,v=>(+v).toFixed(0));
bind(ui.rs,ui.vrs,v=>(+v).toFixed(2));
ui.split.onchange=readParams;
readParams();
document.getElementById("collapse").onclick=e=>{ const p=document.getElementById("panel"); p.classList.toggle("min"); e.target.textContent=p.classList.contains("min")?"+":"–"; };

fetch(DATA_URL+"?v=7").then(r=>r.json()).then(d=>{
  D=d; precompute(); resize();
  if(reduced) draw(0); else if(visible) start();
}).catch(err=>{
  cv.insertAdjacentHTML("afterend",
   `<pre style="position:absolute;left:16px;top:16px;color:#c05549">Failed to load ${DATA_URL}\n${err}\nServe over http.</pre>`);
});
if(window.ResizeObserver){ new ResizeObserver(resize).observe(cv); }
addEventListener("resize",resize);
</script>
</body>
</html>
