<figure class="bd-fig" role="img" aria-label="Left: a flask oscillating between pale yellow and deep blue, driven by a loop of simple reaction steps. Right: a hand-drawn seven multiplied by a weight matrix gives class scores, with seven the winner.">
<style>
.bd-fig { --bd-teal: var(--primary); --bd-orange: #AF672B; --bd-yellow: #F4E9B0; --bd-amber: #E2AE4A; --bd-blue: #23408E;

.dark .bd-fig { --bd-orange: #F6A15F; --bd-yellow: #E9DC9C; --bd-amber: #E7B256; --bd-blue: #3C63CF; }
.bd-fig .bd-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
@media (max-width: 640px) { .bd-fig .bd-panels { grid-template-columns: 1fr; } }
.bd-fig svg { width: 100%; height: auto; display: block; background: var(--bd-card); border: 1px solid var(--border);
  border-radius: 10px; font-family: var(--font-sans); overflow: visible; }
.bd-fig .bd-title { font-size: 12.5px; font-weight: 600; fill: var(--bd-ink); }
.bd-fig .bd-sub { font-size: 10.5px; fill: var(--bd-soft); }
.bd-fig .bd-glass { fill: none; stroke: var(--bd-ink); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.bd-fig .bd-rim { fill: none; stroke: var(--bd-ink); stroke-width: 2.6; stroke-linecap: round; }
.bd-fig .bd-shine { fill: none; stroke: var(--bd-card); stroke-width: 3; stroke-linecap: round; opacity: .55; }
.bd-fig .bd-liquid { fill: var(--bd-yellow); animation: bd-colour 6s linear infinite; }
.bd-fig .bd-surface { fill: var(--bd-yellow); animation: bd-colour 6s linear infinite, bd-slosh 3s ease-in-out infinite; }
@keyframes bd-colour { 0% { fill: var(--bd-yellow); } 58% { fill: var(--bd-amber); } 70% { fill: var(--bd-amber); }
  74% { fill: var(--bd-blue); } 90% { fill: var(--bd-blue); } 100% { fill: var(--bd-yellow); } }
@keyframes bd-slosh { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-14px); } }
.bd-fig .bd-bubble { fill: none; stroke: #fff; stroke-width: 1.4; opacity: 0; animation: bd-rise 6s ease-in infinite; }
@keyframes bd-rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .85; } 80% { opacity: .7; }
  100% { transform: translateY(-70px); opacity: 0; } }
.bd-fig .bd-node circle { fill: var(--bd-card); stroke: var(--bd-teal); stroke-width: 2; }
.bd-fig .bd-node text { font-size: 10px; font-weight: 600; text-anchor: middle; fill: var(--bd-ink); }
.bd-fig .bd-node { transform-box: fill-box; transform-origin: center; animation: bd-pulse 6s ease-in-out infinite; }
@keyframes bd-pulse { 0%,30%,100% { transform: scale(1); } 10% { transform: scale(1.16); } }
.bd-fig .bd-node { --pulse: var(--bd-orange); }
.bd-fig .bd-node circle { animation: bd-glow 6s ease-in-out infinite; animation-delay: inherit; }
@keyframes bd-glow { 0%,30%,100% { stroke: var(--bd-teal); } 10% { stroke: var(--bd-orange); } }
.bd-fig .bd-arrow { fill: none; stroke: var(--bd-soft); stroke-width: 1.6; stroke-dasharray: 4 4; animation: bd-flow 1.2s linear infinite; }
@keyframes bd-flow { to { stroke-dashoffset: -16; } }
.bd-fig .bd-head { fill: var(--bd-soft); }
.bd-fig .bd-trace { fill: none; stroke: var(--bd-teal); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.bd-fig .bd-scroll { animation: bd-scroll 6s linear infinite; }
.bd-fig .bd-nowline { stroke: var(--bd-ink); stroke-width: 1.4; stroke-dasharray: 2 3; }
@keyframes bd-scroll { to { transform: translateX(-100px); } }
.bd-fig .bd-cell { fill: none; stroke: var(--bd-line); stroke-width: 1; }
.bd-fig .bd-ink { fill: var(--bd-teal); opacity: 0; animation: bd-draw 6s ease-out infinite; }
@keyframes bd-draw { 0% { opacity: 0; } 4% { opacity: var(--v); } 82% { opacity: var(--v); } 92%,100% { opacity: 0; } }
.bd-fig .bd-w { opacity: var(--v); }
.bd-fig .bd-w.pos { fill: var(--bd-teal); }
.bd-fig .bd-w.neg { fill: var(--bd-orange); }
.bd-fig .bd-wbox { fill: none; stroke: var(--bd-ink); stroke-width: 1.6; }
.bd-fig .bd-op { font-size: 15px; font-weight: 600; fill: var(--bd-ink); text-anchor: middle; }
.bd-fig .bd-bar { fill: var(--bd-line); transform-box: fill-box; transform-origin: bottom; animation: bd-grow 6s cubic-bezier(.3,1.5,.5,1) infinite; }
.bd-fig .bd-bar.win { fill: var(--bd-orange); }
@keyframes bd-grow { 0%,36% { transform: scaleY(0); } 52% { transform: scaleY(1); } 86% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }
.bd-fig .bd-tick { font-size: 9.5px; text-anchor: middle; fill: var(--bd-soft); }
.bd-fig .bd-tick.win { fill: var(--bd-orange); font-weight: 700; }
.bd-fig .bd-base { stroke: var(--bd-line); stroke-width: 1.2; }
.bd-fig .bd-back { fill: none; stroke: var(--bd-orange); stroke-width: 1.6; stroke-dasharray: 5 4; animation: bd-flow 1.2s linear infinite reverse; }
.bd-fig .bd-headback { fill: var(--bd-orange); }
.bd-fig .bd-grad { font-size: 11px; font-style: italic; fill: var(--bd-orange); text-anchor: middle; }
.bd-fig .bd-pick { opacity: 0; animation: bd-pick 6s ease-out infinite; }
@keyframes bd-pick { 0%,50% { opacity: 0; } 56%,86% { opacity: 1; } 94%,100% { opacity: 0; } }
.bd-fig .bd-pick text { font-size: 11px; font-weight: 700; fill: var(--bd-orange); text-anchor: middle; }
.bd-fig .bd-acc { font-size: 12px; font-weight: 600; fill: var(--bd-ink); text-anchor: middle; }
.bd-fig .bd-acc tspan.n { fill: var(--bd-orange); }
.bd-fig .bd-flowline { fill: none; stroke: var(--bd-soft); stroke-width: 1.6; }
@media (prefers-reduced-motion: reduce) {
  .bd-fig * { animation: none !important; }
  .bd-fig .bd-ink { opacity: var(--v); } .bd-fig .bd-pick { opacity: 1; }
  .bd-fig .bd-liquid, .bd-fig .bd-surface { fill: var(--bd-blue); }
}
